<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main class="app">
        <div class="main__content">
            <h1 class="main__title">
                Consulta CEP
            </h1>

            <input class="input__cep" type="text">

            <div class="button__group">
                <button class="buscarComThen">Buscar com .then()</button>
                <button class="buscarComAsync">Buscar com async/await</button>
            </div>
        </div>
    </main>
    <script>
        const inputCep = document.querySelector('.input__cep')
        const botaoThen = document.querySelector('.buscarComThen')
        const botaoAsync = document.querySelector('.buscarComAsync')

        const url = 'https://viacep.com.br/ws/01001000/json/'
        const consulta = fetch(url);

        function obterCep(){
            return inputCep.value.trim()
        }

        botaoThen.addEventListener("click", () => {
            const cep = obterCep
            consulta
            .then((response) => {

                if(!response.ok){
                    throw new Error('Erro na Requisição.')
                }
                return response.json()
            })
            .then((dados) => {

                if(dados.erro){
                    throw new Error('CEP inválido ou não encontrado.')
                }
                console.log(dados)
            })
            .catch((erro) => {
                console.warn(erro.message)
            });
        })


        //---------------------------------------------------------------------------------//


        /* Criar uma requisição HTTP com fecth e async/await */
        async function buscarCep(){
            let resposta = await consulta;
            console.log(resposta)
            let dataObj = await resposta.json();
            console.log(dataObj);
        };

        botaoAsync.addEventListener("click", function(){
            buscarCep();
        })

    </script>
</body>
</html>
